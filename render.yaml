# Render blueprint: https://render.com/docs/blueprint-spec
# Two free web services. The API builds the field snapshot from the public raw data at build
# time and serves it without a database; the web app talks to it over HTTPS.
# Free services sleep after 15 minutes idle: the first visit after that takes about a minute.
services:
  - type: web
    name: drillsage-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install uv==0.12.19 &&
      cd apps/api &&
      uv sync --frozen --no-dev &&
      uv run --no-sync drillsage-data fetch &&
      uv run --no-sync drillsage-data snapshot
    startCommand: >-
      cd apps/api &&
      uv run --no-sync uvicorn drillsage.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DRILLSAGE_ENVIRONMENT
        value: production
      - key: DRILLSAGE_LOG_JSON
        value: "true"

  - type: web
    name: drillsage-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npx --yes pnpm@9.15.9 install --frozen-lockfile &&
      npx --yes pnpm@9.15.9 --filter web build &&
      cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static &&
      cp -r apps/web/public apps/web/.next/standalone/apps/web/public
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /icon.svg
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_TIMEOUT_MS
        value: "60000"
      - key: API_RENDER_HOST
        fromService:
          type: web
          name: drillsage-api
          property: host
