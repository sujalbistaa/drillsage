# Render blueprint: https://render.com/docs/blueprint-spec
# Two free web services. The API downloads the prebuilt field snapshot (a GitHub Release asset,
# published with `make snapshot-publish`), checks it against the code's schema, and serves it
# without a database; the web app talks to it over HTTPS. The raw sources are not fetched at
# deploy time because Sodir's FactPages do not answer requests from Render.
# Free services sleep after 15 minutes idle: the first visit after that takes about a minute.
services:
  - type: web
    name: drillsage-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install uv==0.12.19 &&
      cd apps/api &&
      uv sync --frozen --no-dev &&
      mkdir -p ../../data/processed/web &&
      curl -fsSL --retry 3 "$SNAPSHOT_URL" -o ../../data/processed/web/field-snapshot.json &&
      uv run --no-sync python -c "from pathlib import Path; from drillsage.field.snapshot import read_snapshot; print(read_snapshot(Path('../../data')).stats)"
    startCommand: >-
      cd apps/api &&
      uv run --no-sync uvicorn drillsage.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DRILLSAGE_ENVIRONMENT
        value: production
      - key: DRILLSAGE_LOG_JSON
        value: "true"
      - key: DRILLSAGE_SNAPSHOT_ONLY
        value: "true"
      - key: SNAPSHOT_URL
        value: https://github.com/sujalbistaa/drillsage/releases/download/field-snapshot/field-snapshot.json

  - type: web
    name: drillsage-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npx --yes pnpm@9.15.9 install --frozen-lockfile &&
      npx --yes pnpm@9.15.9 --filter web build &&
      cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static &&
      cp -r apps/web/public apps/web/.next/standalone/apps/web/public
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /icon.svg
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_TIMEOUT_MS
        value: "60000"
      - key: API_RENDER_HOST
        fromService:
          type: web
          name: drillsage-api
          property: host
