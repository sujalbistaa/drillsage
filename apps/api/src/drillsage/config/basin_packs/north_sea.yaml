# North Sea (Norwegian sector, Central Graben / South Viking Graben) lithostratigraphy.
# Unit names follow the Norwegian Offshore Directorate (Sodir) FactPages, which is also where
# Volve's authoritative formation tops come from. Units are listed top to bottom.
#
# Aliases cover spellings seen in Volve daily reports. "NO FORMAL NAME" and
# "UNDIFFERENTIATED" are Sodir's labels for the unnamed Hordaland claystones in block 15/9;
# they are scoped to this pack and must not be reused for other basins.
