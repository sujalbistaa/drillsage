[project]
name = "drillsage"
version = "0.1.0"
description = "DrillSage: offset-well drilling intelligence for Oil India (SIH26121)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (code); data under source licences, see README" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "lxml>=5.3",
  "pyproj>=3.7",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "anthropic>=1.0",
]

[project.scripts]
drillsage-data = "drillsage.ingest.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "hypothesis>=6.118",
  "mypy>=1.13",
  "ruff>=0.8",
  "lxml-stubs>=0.5",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillsage"]

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL",
  "RUF", "S", "ASYNC", "DTZ", "T20", "ERA", "PERF", "FBT", "TRY", "ANN",
]
ignore = [
  "PLR0913",  # domain functions legitimately take many named parameters
  "TRY003",   # descriptive messages in exceptions are wanted
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "FBT"]
"alembic/**" = ["ANN", "ERA"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a running Postgres (make db-up); skipped automatically when unreachable",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/drillsage"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
