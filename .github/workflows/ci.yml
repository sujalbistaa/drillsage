name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drillsage
          POSTGRES_PASSWORD: drillsage
          POSTGRES_DB: drillsage
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U drillsage -d drillsage"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DRILLSAGE_ENVIRONMENT: test
      DRILLSAGE_DATABASE_URL: postgresql+asyncpg://drillsage:drillsage@localhost:5433/drillsage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest --cov --cov-report=term-missing

  web:
    name: Web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  api-client:
    name: Web client matches API schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd apps/api && uv sync --frozen --python 3.12
      - run: pnpm install --frozen-lockfile
      - run: make api-client-check
